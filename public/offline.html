<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — PPPoker77</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #0a0f0d;
        color: #e8f0eb;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      .logo {
        width: 64px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        background: linear-gradient(135deg, #f0c96b, #d4a843);
        color: #0a0f0d;
        font-size: 2rem;
        font-weight: 900;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0;
      }
      p {
        color: #9ca3af;
        max-width: 24rem;
        line-height: 1.6;
        margin: 0;
      }
      a {
        margin-top: 0.5rem;
        padding: 0.8rem 1.8rem;
        border-radius: 0.75rem;
        background: linear-gradient(135deg, #f0c96b, #d4a843);
        color: #0a0f0d;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="logo">G</div>
    <h1>You are offline</h1>
    <p>Check your connection and try again. Grand Club tables are waiting.</p>
    <a href="/">Retry</a>

</html>
